plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.skhanal.atrium'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.skhanal.atrium'
        // Fire OS 6 on the Toshiba AFTKMST12 is Android 7.1.2 (API 25).
        minSdk 25
        // Kept at 29 so the launcher is not subject to the API 30 package
        // visibility rules, which would hide most installed apps from the
        // app query without a long <queries> list.
        targetSdk 29
        versionCode 1
        versionName '1.0'

        // The TMDB read access token comes from ~/.gradle/gradle.properties,
        // so it never enters git. A build without it still works: the home
        // screen shows apps only. Anyone who copies the APK can read the token.
        // That is accepted for a personal TV.
        def tmdbToken = (project.findProperty('TMDB_READ_TOKEN') ?: '').toString().trim()
        buildConfigField 'String', 'TMDB_READ_TOKEN', "\"${tmdbToken}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies in the app. Everything it runs is framework
// code, which keeps the APK small and the cold start fast on a 2 GB device.
// The test libraries below are not packaged into the APK.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub on the JVM. This is the real library, so
    // the TMDB parser tests run on a Mac without a device.
    testImplementation 'org.json:json:20231013'
}
